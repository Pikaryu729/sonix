[project]
name = "sonix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryushin Wells", email = "ryushin.wells@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sonix = "sonix:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
